[project]
name = "croco-stablebridge"
version = "1.0.0"
description = "Frozen stereo treatment selection and RoCo-Spring submission"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = [
    "torch==2.6.0+cu124",
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "pillow==12.2.0",
    "h5py==3.16.0",
    "einops==0.8.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
